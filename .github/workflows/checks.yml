name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build application
        run: node build.mjs
      - name: Check browser scripts
        run: |
          node --check web/app.mjs
          node --check web/theme.js
      - name: Test financial calculations and API
        run: node --test tests/finance.test.mjs
